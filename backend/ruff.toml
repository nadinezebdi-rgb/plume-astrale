# Ruff config — backend Plume Astrale (2026-02)
# Objectif : refuser toute future fonction de complexité > 15 avant qu'elle n'arrive en prod.
#
# Local : `cd backend && ruff check .`
# CI    : voir .github/workflows/ci.yml (étape "Ruff complexity")

line-length = 120
target-version = "py311"

# Exclusions : scripts one-shot, candidats à suppression, venv
exclude = [
    "_gen_*.py",
    "_candidates_deletion_*.txt",
    "scripts/**/_oneshot_*.py",
    "venv/**",
    ".venv/**",
    "__pycache__/**",
    "assets/**",
    "tests/_fixtures/**",
]

[lint]
# ─── Règles actives ───
# C901 : max-complexity (McCabe cyclomatique)
# F841 : variable assignée mais jamais utilisée
# E722 : bare except
# F401 : imports non utilisés (déjà géré par pyflakes mais explicit)
# Nous commençons strict mais ciblé — pas de style check (E501 line-length désactivé).
select = ["C901", "F841", "E722", "F401"]

ignore = [
    # Autoriser les tests à être "sales" (fixtures, mocks)
    # F401 autorisé dans tests/* via per-file-ignores plus bas
]

[lint.mccabe]
# ⚠️ Seuil durci à 15 (code review 2026-02 · Nao).
# Toute fonction au-dessus doit être extraite en helpers avant merge.
max-complexity = 15

[lint.per-file-ignores]
# Les tests ont souvent des imports pour effet de bord (fixtures, mocks)
"tests/**" = ["F401", "F841"]
"**/__init__.py" = ["F401"]

# ─── Fichiers legacy avec C901 (complexité > 15) ───
# Grandfather : la CI bloque toute NOUVELLE fonction > 15 dans tout le reste du code.
# Ces fichiers doivent être refactorés progressivement — chaque PR qui y touche
# devrait réduire la complexité (extraire 1-2 helpers au moins).
# Ne PAS ajouter de nouveau fichier ici sans justification écrite.
"routes/admin_payments.py" = ["C901"]            # payments_health (24)
"routes/astrosexo.py" = ["C901"]                  # astrosexo_personal (16)
"routes/lecture_complete.py" = ["C901"]           # lecture_complete_admin_orders (17), _refund (27)
