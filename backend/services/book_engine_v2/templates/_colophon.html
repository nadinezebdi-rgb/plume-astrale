{# Colophon — dernière page, §6 #}
<section class="page page-colophon {{ side }}">
  <div class="colophon-inner">
    <img class="plume-mark" src="{{ asset('plume.svg') }}" alt="">
    <p>Le Livre Astral de {{ first_name }}</p>
    <p>Composé et imprimé pour Plume Astrale.</p>
    <p>Roue céleste calculée sur les éphémérides Swiss Ephemeris.</p>
    <p>Prose éditoriale rédigée avec le concours du modèle Claude Sonnet.</p>
    <p class="edition">Édition {{ edition_label }} · {{ edition_year }}</p>
  </div>
</section>
