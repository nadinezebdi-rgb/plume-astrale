#
# nginx-frontend.conf — Plume Astrale, serveur frontend production
# SEO Audit Feb 2026 — Lot 1 : 301 serveur + 404 réels + nettoyage ?post=
#
# Pour toute modification, référez-vous à /app/frontend/src/config/seoRoutes.js
# (source unique de vérité). Les routes connues et le REDIRECT_MAP y sont déclarés.
#
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ─── AUDIT P2-9 (2026-10-30 · Nao) : en-têtes de sécurité ───
    # HSTS, nosniff, Referrer-Policy sont déjà envoyés par le load balancer amont.
    # Ici on ajoute : X-Frame-Options, Permissions-Policy, Content-Security-Policy
    # en mode Report-Only (phase 1 — on observe avant d'imposer).
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https: data:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https:; report-uri /api/csp-reports; report-to csp-endpoint" always;
    add_header Reporting-Endpoints "csp-endpoint=\"/api/csp-reports\"" always;

    # ─── 1. Cache long sur ressources statiques (hashed par CRA build) ───
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── 2. Fichiers bruts et dossiers d'assets publics ───
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }
    location = /favicon.png { try_files $uri =404; }
    location = /manifest.json { try_files $uri =404; }
    location = /logo192.png { try_files $uri =404; }
    location = /logo512.png { try_files $uri =404; }
    location = /google20ef3e9042a818bc.html { try_files $uri =404; }

    location /assets/     { try_files $uri =404; }
    location /images/     { try_files $uri =404; }
    location /videos/     { try_files $uri =404; }
    location /blog/og/    { try_files $uri =404; }
    location /brand/      { try_files $uri =404; }
    location /branding/   { try_files $uri =404; }
    location /demos/      { try_files $uri =404; }
    location /demo/       { try_files $uri =404; }
    location /downloads/  { try_files $uri =404; }
    location /experience/ { try_files $uri =404; }
    location /concours/   { try_files $uri =404; }
    location /marketing/  { try_files $uri =404; }
    location /pitch/      { try_files $uri =404; }
    location /files/      { try_files $uri =404; }

    # ═══════════════════════════════════════════════════════════════════
    # ─── 3. BLOG : nettoyage ?post= (priorité absolue) ───
    # /blog ou /blog/*?post=slug → 301 /blog/slug
    # ═══════════════════════════════════════════════════════════════════
    if ($arg_post != "") {
        return 301 /blog/$arg_post;
    }

    # ═══════════════════════════════════════════════════════════════════
    # ─── 4. Horoscopes semaine/mois : 301 → /horoscope/{signe} ───
    # ═══════════════════════════════════════════════════════════════════
    rewrite ^/horoscope/(belier|taureau|gemeaux|cancer|lion|vierge|balance|scorpion|sagittaire|capricorne|verseau|poissons)/(semaine|mois)/?$ /horoscope/$1 permanent;

    # ═══════════════════════════════════════════════════════════════════
    # ─── 5. REDIRECTIONS 301 EXPLICITES (REDIRECT_MAP) ───
    # ═══════════════════════════════════════════════════════════════════

    # Doublons éditoriaux & URL legacy
    location = /temoignage                      { return 301 /temoignages; }
    location = /home-experience-v3              { return 301 /; }
    location = /compatibilite-amoureuse         { return 301 /services/compatibilite; }
    location = /politique-de-confidentialite    { return 301 /confidentialite; }
    location = /privacy                         { return 301 /confidentialite; }
    location = /nos-livres                      { return 301 /livres; }
    location = /livre                           { return 301 /livres; }
    location = /theme-natal-luxe                { return 301 /theme-natal; }
    location = /cercle                          { return 301 /communaute; }
    location = /cercle-quotidien                { return 301 /communaute; }
    location = /cercle-dashboard                { return 301 /communaute; }

    # Produits renommés
    location = /kabbale                         { return 301 /voyage-karmique; }
    location = /karma-destin                    { return 301 /voyage-karmique; }
    location = /karma-destin-pdf                { return 301 /voyage-karmique; }
    location = /fenetre-rencontre-pdf           { return 301 /rencontres-astrales; }
    location = /premium                         { return 301 /acheter-credits; }
    location = /premium/decouvrir               { return 301 /acheter-credits; }
    location = /premium/experience              { return 301 /acheter-credits; }

    # Routes legacy
    location = /tirage-tarot                    { return 301 /services/tarot; }
    location = /tarot                           { return 301 /services/tarot; }
    location = /compatibilite                   { return 301 /services/compatibilite; }
    location = /mon-rituel                      { return 301 /services/rituel; }
    location = /chat-astral                     { return 301 /services/consultation; }
    location = /consultation                    { return 301 /services/consultation; }
    location = /revolution-solaire              { return 301 /services/revolution-solaire; }
    location = /love-languages                  { return 301 /services/love-languages; }
    location = /oracle                          { return 301 /services/oracle; }
    location = /energie                         { return 301 /services/energie; }
    location = /astrosexo                       { return 301 /services/astrosexo; }

    # /outils/* → /services/*
    location = /outils/theme-natal              { return 301 /services/theme-natal; }
    location = /outils/tarot                    { return 301 /services/tarot; }
    location = /outils/tarot/oui-non            { return 301 /tarot-oui-non; }
    location = /outils/tarot/croix-celtique     { return 301 /services/tarot/croix-celtique; }
    location = /outils/tarot/amour              { return 301 /services/tarot/amour; }
    location = /outils/horoscope                { return 301 /services/horoscope; }
    location = /outils/numerologie              { return 301 /services/numerologie; }
    location = /outils/archetype                { return 301 /services/archetype; }
    location = /outils/compatibilite            { return 301 /services/compatibilite; }
    location = /outils/revolution-solaire       { return 301 /services/revolution-solaire; }
    location = /outils/oracle                   { return 301 /services/oracle; }
    location = /outils/energie                  { return 301 /services/energie; }
    location = /outils/rituel                   { return 301 /services/rituel; }
    location = /outils/consultation             { return 301 /services/consultation; }
    location = /outils/astrosexo                { return 301 /services/astrosexo; }
    location = /outils/love-languages           { return 301 /services/love-languages; }

    # AUDIT P1-2 / P1-3 (2026-10-30 · Nao) :
    #  • /services/tarot/oui-non → /tarot-oui-non (URL unique, canonique sur elle-même)
    #  • /theme-natal-pdf → /theme-natal (ancienne URL 404 déclarée au sitemap)
    location = /services/tarot/oui-non          { return 301 /tarot-oui-non; }
    location = /theme-natal-pdf                 { return 301 /theme-natal; }

    # ═══════════════════════════════════════════════════════════════════
    # ─── 6. ROUTES CONNUES → servent le HTML pré-rendu si présent (postbuild
    #        scripts/prerender_frontend.js), sinon fallback SPA sur index.html.
    #        AUDIT P0-2 (2026-10-30 · Nao) : pré-rendu statique pour SEO.
    # ═══════════════════════════════════════════════════════════════════

    # Accueil + éditoriales
    location = /                                { try_files /index.html =404; }
    location = /decouvrir                       { try_files /decouvrir/index.html /index.html =404; }
    location = /manifesto                       { try_files /manifesto/index.html /index.html =404; }
    location = /cercle-solena                   { try_files /cercle-solena/index.html /index.html =404; }
    location = /cercle-solena/succes            { try_files /index.html =404; }
    location = /barometre-2026                  { try_files /barometre-2026/index.html /index.html =404; }
    location = /communaute                      { try_files /index.html =404; }
    location = /faq                             { try_files /faq/index.html /index.html =404; }
    location = /contact                         { try_files /contact/index.html /index.html =404; }
    location = /charte-de-confiance             { try_files /charte-de-confiance/index.html /index.html =404; }
    location = /notre-cadre                     { try_files /notre-cadre/index.html /index.html =404; }
    location = /mentions-legales                { try_files /index.html =404; }
    location = /cgv                             { try_files /index.html =404; }
    location = /confidentialite                 { try_files /index.html =404; }
    location = /temoignages                     { try_files /temoignages/index.html /index.html =404; }
    location = /bibliotheque                    { try_files /bibliotheque/index.html /index.html =404; }

    # Produits phares
    location = /livres                          { try_files /livres/index.html /index.html =404; }
    location = /theme-natal                     { try_files /theme-natal/index.html /index.html =404; }
    location = /theme-natal/succes              { try_files /index.html =404; }
    # /theme-natal-pdf → 301 /theme-natal (voir section REDIRECT_MAP P1-2)
    location = /edition-reliee                  { try_files /index.html =404; }
    location = /edition-reliee/merci            { try_files /index.html =404; }
    location = /composer                        { try_files /index.html =404; }
    location = /composer/succes                 { try_files /index.html =404; }
    location = /synastrie                       { try_files /index.html =404; }
    location = /synastrie/succes                { try_files /index.html =404; }
    location = /synastrie/checkout              { try_files /index.html =404; }
    location = /synastrie/extrait-envoye       { try_files /index.html =404; }
    location = /voyage-karmique                 { try_files /index.html =404; }
    location = /voyage-karmique/succes          { try_files /index.html =404; }
    location = /astrocartographie               { try_files /index.html =404; }
    location = /astrocartographie/succes        { try_files /index.html =404; }
    location = /pack-karmique                   { try_files /index.html =404; }
    location = /pack-karmique/succes            { try_files /index.html =404; }
    location = /rencontres-astrales             { try_files /index.html =404; }
    location = /rencontres-astrales/succes      { try_files /index.html =404; }
    location = /numerologie-pdf                 { try_files /index.html =404; }
    location = /numerologie-pdf/attente         { try_files /index.html =404; }
    location = /natal-print                     { try_files /index.html =404; }
    location = /natal-print/merci               { try_files /index.html =404; }
    location = /lecture-complete/succes         { try_files /index.html =404; }
    location = /trio-decouverte                 { try_files /index.html =404; }
    location = /trio-decouverte/succes          { try_files /index.html =404; }
    location = /duo-completion/succes           { try_files /index.html =404; }
    location = /acheter-credits                 { try_files /index.html =404; }
    location = /credits                         { try_files /index.html =404; }
    location = /credits/succes                  { try_files /index.html =404; }
    location = /paiement                        { try_files /index.html =404; }
    location = /paiement/succes                 { try_files /index.html =404; }
    location = /commande/succes                 { try_files /index.html =404; }
    location = /resultats                       { try_files /index.html =404; }
    location = /kabbale/succes                  { try_files /index.html =404; }
    location = /karma-destin/attente            { try_files /index.html =404; }

    # Services (/services/*)
    location = /services/theme-natal            { try_files /index.html =404; }
    location = /services/tarot                  { try_files /services/tarot/index.html /index.html =404; }
    # /services/tarot/oui-non → 301 /tarot-oui-non (voir section REDIRECT_MAP P1-3)
    location = /services/tarot/croix-celtique   { try_files /services/tarot/croix-celtique/index.html /index.html =404; }
    location = /services/tarot/amour            { try_files /services/tarot/amour/index.html /index.html =404; }
    location = /services/horoscope              { try_files /index.html =404; }
    location = /services/numerologie            { try_files /index.html =404; }
    location = /services/archetype              { try_files /index.html =404; }
    location = /services/compatibilite          { try_files /services/compatibilite/index.html /index.html =404; }
    location = /services/revolution-solaire     { try_files /services/revolution-solaire/index.html /index.html =404; }
    location = /services/oracle                 { try_files /services/oracle/index.html /index.html =404; }
    location = /services/energie                { try_files /services/energie/index.html /index.html =404; }
    location = /services/rituel                 { try_files /services/rituel/index.html /index.html =404; }
    location = /services/consultation           { try_files /index.html =404; }
    location = /services/astrosexo              { try_files /index.html =404; }
    location = /services/love-languages         { try_files /services/love-languages/index.html /index.html =404; }

    # Outils éditoriaux
    location = /tarologie                       { try_files /tarologie/index.html /index.html =404; }
    location = /tarot-oui-non                   { try_files /tarot-oui-non/index.html /index.html =404; }
    location = /numerologie                     { try_files /index.html =404; }
    location = /quotidien                       { try_files /quotidien/index.html /index.html =404; }
    location = /experience                      { try_files /index.html =404; }
    location = /horoscope                       { try_files /horoscope/index.html /index.html =404; }

    # Authentification & compte (noindex côté React)
    location = /inscription                     { try_files /index.html =404; }
    location = /connexion                       { try_files /index.html =404; }
    location = /mon-compte                      { try_files /index.html =404; }
    location = /mon-compte/mon-livre            { try_files /index.html =404; }
    location = /mon-accueil                     { try_files /index.html =404; }
    location = /formulaire                      { try_files /index.html =404; }
    location = /apercu                          { try_files /index.html =404; }
    location = /choix                           { try_files /index.html =404; }
    location = /panier                          { try_files /index.html =404; }
    location = /mot-de-passe-oublie             { try_files /index.html =404; }
    location = /reinitialiser-mot-de-passe     { try_files /index.html =404; }
    location = /desabonnement                   { try_files /index.html =404; }

    # Cadeaux
    location = /carte-cadeau                    { try_files /index.html =404; }
    location = /carte-cadeau/merci              { try_files /index.html =404; }

    # Admin (noindex côté React)
    location = /admin                           { try_files /index.html =404; }
    location = /admin/analytics                 { try_files /index.html =404; }
    location = /admin/pdf-test                  { try_files /index.html =404; }
    location = /admin/qr-stats                  { try_files /index.html =404; }
    location = /admin/lulu-orders               { try_files /index.html =404; }
    location = /admin/alerts                    { try_files /index.html =404; }
    location = /admin/payments-health           { try_files /index.html =404; }

    # Test interne (noindex)
    location = /test/cta                        { try_files /index.html =404; }

    # ─── Routes dynamiques avec validation ───

    # /blog hub
    location = /blog                            { try_files /blog/index.html /index.html =404; }
    # /blog/<slug> — Liste explicite des slugs connus, auto-générée par
    # scripts/generate_sitemap.py (inclut nginx-blog-slugs.conf). Toute URL
    # /blog/<slug-inconnu> renvoie alors 404 côté serveur.
    include /etc/nginx/conf.d/nginx-blog-slugs.conf;

    # /horoscope/<signe> — 12 signes autorisés uniquement, HTML pré-rendu si dispo
    location ~ ^/horoscope/(belier|taureau|gemeaux|cancer|lion|vierge|balance|scorpion|sagittaire|capricorne|verseau|poissons)/?$ {
        try_files /horoscope/$1/index.html /index.html =404;
    }

    # /tirage-partage/<shareId>, /carte-cadeau/redeem/<code>, /relecture/<token>
    location ~ ^/tirage-partage/[a-zA-Z0-9_-]+/?$   { try_files /index.html =404; }
    location ~ ^/carte-cadeau/redeem/[a-zA-Z0-9_-]+/?$ { try_files /index.html =404; }
    location ~ ^/relecture/[a-zA-Z0-9_-]+/?$       { try_files /index.html =404; }

    # ═══════════════════════════════════════════════════════════════════
    # ─── 7. CATCH-ALL : toute URL inconnue → 404 réel ───
    # ═══════════════════════════════════════════════════════════════════
    location / {
        # Essaye d'abord de servir un fichier statique (si l'URL correspond à
        # un chemin de fichier dans /usr/share/nginx/html), sinon 404.
        try_files $uri =404;
    }

    # ─── Page 404 personnalisée (noindex) ───
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }
}
