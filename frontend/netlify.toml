[build]
  command = "yarn build"
  publish = "build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback - serve index.html for all routes not matching a file
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
