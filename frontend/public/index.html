<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Plume Astrale</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1C1445, #0F0B2E);
      color: #F8F7FF;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('https://www.transparenttextures.com/patterns/stardust.png');
      opacity: 0.3;
      animation: moveStars 120s linear infinite;
    }

    @keyframes moveStars {
      from { transform: translateY(0); }
      to { transform: translateY(-2000px); }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 80px auto;
      padding: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin-bottom: 10px;
    }

    .energy {
      text-align: center;
      color: #F5D97B;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(212,175,55,0.2);
      box-shadow: 0 0 40px rgba(212,175,55,0.1);
      animation: fadeIn 1.5s ease;
    }

    .loading {
      text-align: center;
      opacity: 0.7;
    }

    .btn {
      margin-top: 20px;
      display: block;
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #D4AF37, #F5D97B);
      color: #0F0B2E;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #D4AF37;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>

<body>

<div class="stars"></div>

<div class="container">

  <h1>Bonjour Nadine ✨</h1>
  <div class="energy">Énergie du jour : 78% 🔥</div>

  <div class="card" id="journal">
    <div class="loading">Connexion aux énergies...</div>
  </div>

  <button class="btn" onclick="loadJournal()">✨ Révéler mon message</button>

</div>

<script>
async function loadJournal() {
  document.getElementById("journal").innerHTML = "Connexion aux énergies... ✨";

  const res = await fetch("/.netlify/edge-functions/journal", {
    method: "POST",
    body: JSON.stringify({
      name: "Nadine",
      sign: "Balance",
      lifePath: 6,
      tarotCard: "L'Étoile",
      energyScore: 78
    })
  });

  const data = await res.json();

  document.getElementById("journal").innerHTML = data.journal;
}
</script>

</body>
</html>
