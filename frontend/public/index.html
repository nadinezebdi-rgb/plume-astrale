<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0C0918" />
        <meta name="description" content="Une lecture personnelle de ton thème natal composée par Soléna. Livre imprimé prestige, livraison en 48h." />
        <meta name="author" content="Plume Astrale" />
        <meta name="robots" content="index, follow" />
        <meta name="googlebot" content="index, follow" />
        <meta name="google-site-verification" content="_HIsHjWgL61kcCdFBHvhPT4p3PE8AqPnADtRj42Sha8" />
        <!-- ⚠ SEO P1 (concours 2026-02) : PAS de balise canonical hardcodée ici.
             Toutes les pages pointaient à tort vers la home → toutes vues en doublons.
             La bonne balise canonical est désormais injectée dynamiquement par
             /src/components/SEO.js à partir de la route actuelle. -->

        <!-- Open Graph defaults (overridden per page by /src/components/SEO.js) -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://plume-astrale.fr" />
        <meta property="og:title" content="Plume Astrale · Ta lecture astrologique unique" />
        <meta property="og:description" content="Une lecture personnelle de ton thème natal composée par Soléna. Livre imprimé prestige, livraison en 48h." />
        <meta property="og:image" content="https://plume-astrale.fr/og-cover.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:site_name" content="Plume Astrale" />
        <meta property="og:locale" content="fr_FR" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Plume Astrale · Ta lecture astrologique unique" />
        <meta name="twitter:description" content="Une lecture personnelle de ton thème natal composée par Soléna. Livre imprimé prestige, livraison en 48h." />
        <meta name="twitter:image" content="https://plume-astrale.fr/og-cover.jpg" />

        <!-- Fonts (only the ones actually used) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <title>Plume Astrale · Ta lecture astrologique unique</title>

        <!-- JSON-LD Structured Data -->
        <!-- ⚠ SEO P5 (concours 2026-02) : suppression du bloc potentialAction/
             SearchAction — pas de recherche interne implémentée, l'URL
             /?q={search_term_string} générait un rapport d'erreur Search Console. -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Plume Astrale",
            "url": "https://plume-astrale.fr",
            "description": "Guidance symbolique personnalisee — Astrologie, tarot et numerologie",
            "inLanguage": "fr"
        }
        </script>
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "ProfessionalService",
            "name": "Plume Astrale",
            "url": "https://plume-astrale.fr",
            "description": "Espace de guidance symbolique fonde sur des calculs astrologiques precis et une interpretation experte.",
            "serviceType": ["Astrologie", "Tarot", "Numerologie", "Guidance spirituelle"],
            "areaServed": {
                "@type": "Country",
                "name": "France"
            },
            "hasOfferCatalog": {
                "@type": "OfferCatalog",
                "name": "Services Plume Astrale",
                "itemListElement": [
                    {
                        "@type": "Offer",
                        "name": "Tirage Tarot Oui/Non",
                        "description": "3 tirages gratuits par jour — Reponse symbolique immediate",
                        "price": "0",
                        "priceCurrency": "EUR"
                    },
                    {
                        "@type": "Offer",
                        "name": "Theme Astral Professionnel",
                        "description": "Votre theme astral complet en PDF — 28+ pages",
                        "price": "29.90",
                        "priceCurrency": "EUR"
                    },
                    {
                        "@type": "Offer",
                        "name": "Experience Premium — Cartographie Celeste",
                        "description": "Parcours guide en 5 etapes + PDF Premium — Astrologie, numerologie et projection 12 mois",
                        "price": "199",
                        "priceCurrency": "EUR"
                    }
                ]
            }
        }
        </script>

        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>Plume Astrale — Guidance symbolique personnalisee. Activez JavaScript pour acceder a votre theme natal, tirage de tarot et numerologie.</noscript>
        <div id="root"></div>
        <!-- Meta Pixel noscript fallback (RGPD : image de tracking uniquement,
             pas de JS ; l'envoi via image reste soumis au consentement affiché
             sur le site — celle-ci est un filet de sécurité pour les crawlers
             et pour les utilisateurs sans JS, très minoritaires). -->
        <noscript>
          <img height="1" width="1" style="display:none"
               src="https://www.facebook.com/tr?id=1801418127692821&ev=PageView&noscript=1"
               alt="" />
        </noscript>
    </body>
</html>
