name: Smoke API Compatibility

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/smoke-api-compat.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'tests/smoke_api_compat.py'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/smoke-api-compat.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'tests/smoke_api_compat.py'
      - 'README.md'
  workflow_dispatch:

jobs:
  smoke-api-compat-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run quick compatibility smoke test
        run: |
          python tests/smoke_api_compat.py --suite quick

  smoke-api-compat-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run PDF compatibility smoke test
        run: |
          python tests/smoke_api_compat.py --suite pdf
