name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run pytest (hors tests lents + e2e)
        working-directory: backend
        env:
          # Variables fictives pour éviter les crashes au boot — les tests
          # unitaires ne doivent pas toucher à Supabase / Stripe / Mongo réels.
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: plume_ci
          SUPABASE_URL: https://ci.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-fake-key
          EMERGENT_LLM_KEY: ci-fake-key
          STRIPE_API_KEY: sk_test_ci
          STRIPE_ALLOW_TEST_MODE: 'true'
          DISABLE_BACKGROUND_TASKS: 'true'
        run: |
          # On exclut les tests "@slow" (Playwright + ffmpeg réel, trop lent en CI)
          # et les tests qui nécessitent un backend live.
          pytest tests/ \
            -m "not slow" \
            --ignore=tests/test_audit_p0_delivery.py \
            --ignore=tests/test_admin_refactor_regression.py \
            -q --tb=short

  frontend-build:
    name: Frontend · yarn build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: frontend
        env:
          CI: 'false' # React warnings = warnings, pas errors
          REACT_APP_BACKEND_URL: https://plume-astrale.fr
        run: yarn build
